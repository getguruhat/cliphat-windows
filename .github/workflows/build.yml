name: Build Windows installer
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Publish application
        run: dotnet publish ClipHat.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish
      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress
      - name: Build installer
        shell: pwsh
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss'
      - uses: actions/upload-artifact@v4
        with:
          name: ClipHat-Windows-installer
          path: dist/ClipHat-1.1.0-Windows-Setup.exe
      - name: Publish release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release view v1.1.0-windows *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload v1.1.0-windows dist/ClipHat-1.1.0-Windows-Setup.exe --clobber
          } else {
            gh release create v1.1.0-windows dist/ClipHat-1.1.0-Windows-Setup.exe --title "ClipHat for Windows 1.1.0" --notes "Windows 10/11 x64 installer with sliding side panel."
          }
