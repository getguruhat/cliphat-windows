name: Build Windows installer
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Read version
        shell: pwsh
        run: |
          $version = ([xml](Get-Content ClipHat.csproj)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          "VERSION=$version" | Out-File $env:GITHUB_ENV -Append
      # .NET Framework 4.8 comes with Windows, so this is a small folder, not a self-contained runtime.
      - name: Publish application
        shell: pwsh
        run: |
          dotnet publish ClipHat.csproj -c Release -o publish
          if ($LASTEXITCODE -ne 0) { throw "dotnet publish failed" }
          Get-ChildItem publish | Format-Table Name, Length
          "Total: {0:N2} MB" -f ((Get-ChildItem publish -Recurse | Measure-Object Length -Sum).Sum / 1MB)
      - name: Verify sliding panel on Windows
        shell: pwsh
        run: |
          $app = Start-Process publish/ClipHat.exe -ArgumentList '--smoke-test' -PassThru -Wait
          if ($app.ExitCode -ne 0) { throw "Panel smoke test failed: $($app.ExitCode)" }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Windows-panel-screenshots
          path: screenshots/*.png
      # The Microsoft Store version. It's uploaded unsigned: the Store signs it when it publishes.
      - name: Build MSIX package
        shell: pwsh
        run: |
          $sdk = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\10.*" | Sort-Object { [version]$_.Name } | Select-Object -Last 1
          "$sdk\x64" | Out-File $env:GITHUB_PATH -Append
          New-Item -ItemType Directory msix-layout, dist -Force | Out-Null
          Copy-Item publish\* msix-layout -Recurse
          Copy-Item msix\Assets msix-layout -Recurse
          $manifest = [xml](Get-Content msix\AppxManifest.xml)
          $manifest.Package.Identity.Version = "$env:VERSION.0"
          $manifest.Save("$PWD\msix-layout\AppxManifest.xml")
          & "$sdk\x64\makeappx.exe" pack /d msix-layout /p "dist\ClipHat-$env:VERSION-x64.msix" /o
          if ($LASTEXITCODE -ne 0) { throw "makeappx failed" }
      # Signs a copy with a throwaway certificate, installs it, and checks the app starts.
      - name: Test-install MSIX package
        shell: pwsh
        run: |
          $msix = (Get-Item dist\*.msix).FullName
          $identity = ([xml](Get-Content msix\AppxManifest.xml)).Package.Identity
          $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject $identity.Publisher -CertStoreLocation Cert:\CurrentUser\My -TextExtension @("2.5.29.19={text}")
          $password = ConvertTo-SecureString -String "test" -Force -AsPlainText
          Export-PfxCertificate -Cert $cert -FilePath test.pfx -Password $password | Out-Null
          Import-PfxCertificate -FilePath test.pfx -CertStoreLocation Cert:\LocalMachine\TrustedPeople -Password $password | Out-Null
          Copy-Item $msix test.msix
          signtool sign /fd SHA256 /f test.pfx /p test test.msix
          if ($LASTEXITCODE -ne 0) { throw "signtool failed" }
          Add-AppxPackage test.msix
          $package = Get-AppxPackage -Name $identity.Name
          if (-not $package) { throw "MSIX did not install" }
          "Installed $($package.PackageFullName)"
          # Launching through the shell can fail on a runner with no desktop session, so this only warns.
          Start-Process "shell:AppsFolder\$($package.PackageFamilyName)!ClipHat" -ErrorAction SilentlyContinue
          Start-Sleep 10
          $app = Get-Process ClipHat -ErrorAction SilentlyContinue
          if ($app) {
            "ClipHat is running from the package (pid $($app.Id))"
            $app | Stop-Process -Force
          } else { "::warning::ClipHat did not start from the MSIX package on the runner" }
          Remove-AppxPackage $package.PackageFullName
      - uses: actions/upload-artifact@v4
        with:
          name: ClipHat-Windows-msix
          path: dist/*.msix
      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress
      - name: Build installer
        shell: pwsh
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss'
      - uses: actions/upload-artifact@v4
        with:
          name: ClipHat-Windows-installer
          path: dist/ClipHat-*-Windows-Setup.exe
      - name: Publish release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = "v$env:VERSION-windows"
          $installer = "dist/ClipHat-$env:VERSION-Windows-Setup.exe"
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $installer --clobber
          } else {
            gh release create $tag $installer --title "ClipHat for Windows $env:VERSION" --notes-file RELEASE_NOTES.md
          }
